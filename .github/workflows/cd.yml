name: cd

on:
    push:
        branches: [main]

jobs:
    tests:
        name: Deploy
        runs-on: ubuntu-latest

        env:
            TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
            TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
        
        steps:
            - name: Check out code
              uses: actions/checkout@v6
              with:
                python-version: '3.13'
                cache: 'pip'
            
            - name: Install Bandit
              run: pip install bandit

            - id: "auth"
              uses: "google-github-actions/auth@v2"
              with:
                credentials_json: "${{ secrets.GCP_CRED }}"
            
            - name: "Set up Cloud SDK"
              uses: "google-github-actions/setup-gcloud@v3"

            - name: "Use gcloud CLI"
              run: "gcloud info"

            - name: "Build Docker image"
              run: "gcloud builds submit --tag us-central1-docker.pkg.dev/library-manager-507510/booklibrarymanager/library_manager:latest"

            - name: "Deploy to cloud run"
              run: "gcloud run deploy library-manager --image us-central1-docker.pkg.dev/library-manager-507510/booklibrarymanager/library_manager:latest --region us-central1 --allow-unauthenticated --project library-manager-507510 --max-instances=1 --port 8991"